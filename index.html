<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>অর্ধনারীশ্বর — আসল রুদ্রাক্ষ ও পূজার সামগ্রী</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Hind Siliguri','Noto Sans Bengali',sans-serif;}
body{background:#E9E2D0;color:#2b2320;}
.wrap{max-width:480px;margin:0 auto;background:#FCF8EE;min-height:100vh;position:relative;padding-bottom:78px;box-shadow:0 0 24px rgba(0,0,0,.18);}
header{background:#4A0E12;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;}
.logo{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F3CD6B,#C68E20);display:flex;align-items:center;justify-content:center;font-size:24px;color:#4A0E12;font-weight:700;flex:none;}
header h1{font-size:23px;color:#F3CD6B;line-height:1.1;}
header p{font-size:12px;color:#f3e2c7;}
.search{display:flex;margin:14px 16px 0;background:#fff;border:1.5px solid #C68E20;border-radius:10px;overflow:hidden;}
.search input{flex:1;border:0;padding:12px;font-size:15px;outline:none;min-width:0;}
.search button{background:#7A1218;color:#fff;border:0;padding:0 20px;font-size:15px;font-weight:600;cursor:pointer;}
.hero{margin:14px 16px 0;background:linear-gradient(120deg,#4A0E12,#7A1218);border-radius:14px;color:#fff;padding:20px;position:relative;overflow:hidden;}
.hero h2{color:#F3CD6B;font-size:22px;margin-bottom:6px;}
.hero p{font-size:13.5px;color:#f7ead2;}
.hero .cta{display:inline-block;margin-top:12px;background:#C68E20;color:#fff;padding:9px 18px;border-radius:20px;font-weight:700;font-size:14px;}
.hero .om{position:absolute;right:6px;top:-16px;font-size:110px;color:rgba(255,255,255,.08);font-weight:700;}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 16px 10px;}
.sec h3{font-size:18px;color:#4A0E12;}
.sec span{font-size:13px;color:#C68E20;cursor:pointer;}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 16px;}
.cat{background:#fff;border:1px solid #eee0bd;border-radius:12px;padding:12px 4px;text-align:center;cursor:pointer;}
.cat .ic{width:48px;height:48px;margin:0 auto 6px;border-radius:50%;background:#FBF3DC;display:flex;align-items:center;justify-content:center;font-size:23px;}
.cat b{font-size:13.5px;color:#4A0E12;display:block;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 16px;}
.card{background:#fff;border:1px solid #f0e4c4;border-radius:12px;overflow:hidden;cursor:pointer;}
.card img{width:100%;height:170px;object-fit:cover;display:block;}
.card .b{padding:10px;}
.card h4{font-size:14.5px;color:#33231f;min-height:38px;}
.p{color:#7A1218;font-weight:800;font-size:16px;margin:4px 0 8px;}
.p s{color:#b3a58f;font-weight:400;font-size:13px;margin-left:6px;}
.p.inbox{font-size:14px;color:#7A1218;}
.btn{display:block;text-align:center;background:#7A1218;color:#fff;padding:9px;border-radius:8px;font-weight:700;font-size:14.5px;cursor:pointer;}
.trust{margin:20px 16px 0;background:#fff;border:1px solid #eee0bd;border-radius:12px;display:grid;grid-template-columns:repeat(3,1fr);padding:12px 6px;text-align:center;}
.trust div{font-size:12px;color:#4A0E12;font-weight:600;}
.trust .ic{font-size:20px;display:block;margin-bottom:4px;}
footer{text-align:center;color:#8a7a63;font-size:12.5px;padding:22px 16px 8px;line-height:1.7;}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #eee0bd;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 0 10px;z-index:20;}
.nav div{text-align:center;font-size:12.5px;color:#8a7a63;cursor:pointer;}
.nav .ic{font-size:20px;display:block;}
.nav .on{color:#7A1218;font-weight:700;}
.backbar{background:#4A0E12;color:#fff;padding:14px 16px;font-size:17px;font-weight:700;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:20;}
.backbar span{cursor:pointer;}
.hero-img{width:100%;height:auto;max-height:560px;object-fit:cover;object-position:top;display:block;background:#fff;}
.thumbs{display:flex;gap:8px;padding:12px 16px 0;}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:2px solid #e5d9b8;cursor:pointer;}
.thumbs img.on{border-color:#C68E20;}
.dwrap{padding:6px 16px 0;}
.dwrap h1{font-size:21px;color:#33231f;margin:8px 0 6px;}
.stock{color:#1d7a35;font-size:13.5px;font-weight:600;margin:4px 0 12px;}
.out{color:#b03a2e;}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px;}
.chip{background:#fff;border:1px solid #eee0bd;border-radius:10px;padding:9px 6px;text-align:center;}
.chip small{display:block;color:#C68E20;font-size:11.5px;}
.chip b{color:#7A1218;font-size:14px;}
.dsec{margin-top:16px;}
.dsec h3{color:#4A0E12;font-size:16.5px;margin-bottom:7px;}
.dsec li{list-style:none;font-size:14.5px;color:#4c3f36;padding:3.5px 0 3.5px 20px;position:relative;line-height:1.45;}
.dsec li:before{content:'◆';color:#C68E20;position:absolute;left:0;font-size:11px;top:7px;}
.qty{display:flex;align-items:center;gap:14px;margin:16px 0 4px;}
.qty .box{display:flex;border:1.5px solid #C68E20;border-radius:9px;overflow:hidden;}
.qty button{width:38px;height:38px;border:0;background:#fff;font-size:19px;cursor:pointer;}
.qty .n{width:42px;text-align:center;line-height:38px;font-weight:700;background:#FBF3DC;}
.qty small{color:#8a7a63;}
.note{font-size:12px;color:#a08b62;margin:12px 0;line-height:1.6;}
.buybar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #eee0bd;display:flex;gap:10px;padding:10px 14px;z-index:20;}
.buybar a{flex:1;text-align:center;padding:12px;border-radius:9px;font-weight:700;font-size:15.5px;cursor:pointer;text-decoration:none;}
.buybar .inb{border:1.5px solid #7A1218;color:#7A1218;background:#fff;}
.buybar .ord{background:#7A1218;color:#fff;}
.fcard{margin:14px 16px 0;background:#fff;border:1px solid #eee0bd;border-radius:12px;padding:14px;}
.fcard h3{color:#4A0E12;font-size:16px;margin-bottom:10px;}
.frow{display:flex;gap:12px;align-items:center;}
.frow img{width:74px;height:74px;object-fit:cover;border-radius:9px;}
.frow b{font-size:15px;color:#33231f;}
label.fl{display:block;font-size:13.5px;font-weight:600;color:#4A0E12;margin:13px 0 5px;}
input.fi,textarea.fi{width:100%;border:1.5px solid #e0d0a5;border-radius:9px;padding:11px;font-size:15px;outline:none;background:#FFFDF6;}
input.fi:focus,textarea.fi:focus{border-color:#C68E20;}
.radio{display:flex;gap:9px;}
.radio label{flex:1;border:1.5px solid #e0d0a5;border-radius:9px;padding:10px;text-align:center;font-size:14px;cursor:pointer;background:#FFFDF6;}
.radio input{display:none;}
.radio label.sel{border-color:#7A1218;background:#FBEEE9;font-weight:700;color:#7A1218;}
.trow{display:flex;justify-content:space-between;font-size:14.5px;padding:5px 0;color:#4c3f36;}
.trow.total{border-top:1px dashed #d9c48c;margin-top:7px;padding-top:10px;font-weight:800;color:#7A1218;font-size:16.5px;}
.bigbtn{display:block;width:100%;margin-top:14px;background:#7A1218;color:#fff;border:0;padding:14px;border-radius:10px;font-size:16.5px;font-weight:700;cursor:pointer;}
.ok{text-align:center;padding:36px 22px;}
.ok .tick{width:74px;height:74px;margin:0 auto 14px;border-radius:50%;background:#1d7a35;color:#fff;font-size:37px;display:flex;align-items:center;justify-content:center;}
.ok h2{color:#4A0E12;font-size:21px;margin-bottom:8px;}
.ok p{font-size:14.5px;color:#4c3f36;line-height:1.65;}
.okbox{background:#fff;border:1px dashed #C68E20;border-radius:10px;padding:12px;font-size:13.5px;text-align:left;white-space:pre-wrap;margin:14px 0;line-height:1.6;color:#4c3f36;}
.copybtn{background:#C68E20;color:#fff;border:0;padding:11px 20px;border-radius:9px;font-weight:700;cursor:pointer;font-size:14.5px;}
.msbtn{display:block;margin-top:10px;background:#7A1218;color:#fff;padding:12px;border-radius:9px;font-weight:700;text-decoration:none;font-size:15px;}
.empty{margin:30px 16px;text-align:center;color:#8a7a63;font-size:14.5px;}
@media(min-width:481px){.nav,.buybar{border-left:1px solid #eee0bd;border-right:1px solid #eee0bd;}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
let DB = null, SET = {};
const BN = s => String(s).replace(/[0-9]/g, d => '০১২৩৪৫৬৭৮৯'[d]);
const taka = n => '৳ ' + BN(Number(n).toLocaleString('en-IN'));
const $app = document.getElementById('app');

fetch('products.json').then(r => r.json()).then(d => { DB = d; SET = d.settings || {}; route(); })
 .catch(() => { $app.innerHTML = '<div class="empty">ডেটা লোড হয়নি। পেজটি রিফ্রেশ করুন।</div>'; });
window.addEventListener('hashchange', route);

function priceHTML(p) {
  if (p.price == null) return '<div class="p inbox">দাম জানতে ইনবক্স করুন</div>';
  let h = '<div class="p">' + taka(p.price);
  if (p.oldPrice) h += '<s>' + taka(p.oldPrice) + '</s>';
  return h + '</div>';
}
function card(p) {
  return `<div class="card" onclick="location.hash='#p/${p.id}'"><img src="images/${p.image}" alt="">
    <div class="b"><h4>${p.name}</h4>${priceHTML(p)}<a class="btn">অর্ডার করুন</a></div></div>`;
}
function bottomNav(on) {
  return `<div class="nav">
    <div class="${on==='home'?'on':''}" onclick="location.hash=''"><span class="ic">🏠</span>হোম</div>
    <div class="${on==='cat'?'on':''}" onclick="location.hash='#cats'"><span class="ic">📂</span>ক্যাটাগরি</div>
    <div onclick="openMessenger()"><span class="ic">💬</span>সাপোর্ট</div></div>`;
}
function openMessenger() {
  if (SET.messenger) window.open(SET.messenger, '_blank');
  else alert('অর্ডার বা যেকোনো তথ্যের জন্য আমাদের Facebook Page-এ ইনবক্স করুন।');
}
function homeHTML(list) {
  const cats = (DB.categories || []).map(c => {
    const ic = {'রুদ্রাক্ষ':'📿','মালা':'🧿','পূজার সামগ্রী':'🪔','কম্বো অফার':'🎁'}[c] || '✨';
    return `<div class="cat" onclick="location.hash='#cat/${encodeURIComponent(c)}'"><div class="ic">${ic}</div><b>${c}</b></div>`;
  }).join('');
  let secs = '';
  (DB.categories || []).forEach(c => {
    const items = list.filter(p => p.category === c);
    if (!items.length) return;
    secs += `<div class="sec"><h3>${c}</h3><span onclick="location.hash='#cat/${encodeURIComponent(c)}'">সব দেখুন ›</span></div>
             <div class="grid">${items.slice(0, 6).map(card).join('')}</div>`;
  });
  if (!list.length) secs = '<div class="empty">কোনো প্রোডাক্ট পাওয়া যায়নি।</div>';
  return `<header><div class="logo">ॐ</div><div><h1>${SET.shopName || 'অর্ধনারীশ্বর'}</h1><p>${SET.tagline || ''}</p></div></header>
  <div class="search"><input id="q" placeholder="রুদ্রাক্ষ খুঁজুন..." oninput="doSearch(this.value)"><button>খুঁজুন</button></div>
  <div class="hero"><div class="om">ॐ</div><h2>আসল নেপালি রুদ্রাক্ষ</h2>
    <p>ল্যাব টেস্ট সার্টিফিকেটসহ • আসল ছবি ও ভিডিও দেখে অর্ডার করুন</p><span class="cta">কিনতে ক্লিক করুন</span></div>
  <div class="sec"><h3>ক্যাটাগরি</h3></div><div class="cats">${cats}</div>
  ${secs}
  <div class="trust"><div><span class="ic">🚚</span>সারা দেশে হোম ডেলিভারি</div><div><span class="ic">✅</span>ল্যাব টেস্টেড আসল</div><div><span class="ic">💬</span>Messenger-এ সাপোর্ট</div></div>
  <footer>${SET.shopName || 'অর্ধনারীশ্বর'} — আসল রুদ্রাক্ষের বিশ্বস্ত ঠিকানা<br>© ২০২৬ ${SET.shopName || 'অর্ধনারীশ্বর'}</footer>
  ${bottomNav('home')}`;
}
function doSearch(q) {
  q = q.trim();
  const list = q ? DB.products.filter(p => p.name.includes(q) || p.category.includes(q)) : DB.products;
  const secs = document.querySelectorAll('.sec,.grid');
  $app.innerHTML = homeHTML(list);
  const inp = document.getElementById('q'); inp.value = q; inp.focus();
}
function detailHTML(p) {
  const imgs = [p.image].concat(p.images || []);
  const thumbs = imgs.map((im, i) => `<img class="${i===0?'on':''}" src="images/${im}" onclick="swapImg(this,'${im}')">`).join('');
  const chips = (p.chips || []).length ? `<div class="chips">${p.chips.map(c => `<div class="chip"><small>${c[0]}</small><b>${c[1]}</b></div>`).join('')}</div>` : '';
  const sec = (t, arr) => (arr && arr.length) ? `<div class="dsec"><h3>${t}</h3><ul>${arr.map(x => `<li>${x}</li>`).join('')}</ul></div>` : '';
  let price = '';
  if (p.price == null) price = '<div class="p inbox" style="font-size:17px">দাম জানতে ইনবক্স করুন</div>';
  else { price = `<div class="p" style="font-size:22px">${taka(p.price)}${p.oldPrice ? '<s>' + taka(p.oldPrice) + '</s>' : ''}${p.oldPrice ? '<span style="background:#C68E20;color:#fff;font-size:12px;padding:2px 8px;border-radius:10px;margin-left:8px">' + BN(Math.round((1 - p.price / p.oldPrice) * 100)) + '% ছাড়</span>' : ''}</div>`; }
  return `<div class="backbar"><span onclick="history.back()">‹</span> প্রোডাক্ট ডিটেইলস</div>
  <img class="hero-img" id="heroImg" src="images/${p.image}">
  <div class="thumbs">${thumbs}</div>
  <div class="dwrap"><h1>${p.name}</h1>${price}
    <div class="stock ${p.stock ? '' : 'out'}">${p.stock ? '✓ স্টকে আছে — আজই অর্ডার করুন' : '✗ স্টকে নেই'}</div>
    ${chips}
    ${sec('কারা ব্যবহার করতে পারবেন', p.who)}
    ${sec('উপকারিতা (প্রচলিত বিশ্বাস)', p.benefits)}
    ${sec('ব্যবহারের নিয়ম', p.rules)}
    <div class="qty"><div class="box"><button onclick="chgQty(-1)">−</button><div class="n" id="qtyN">১</div><button onclick="chgQty(1)">+</button></div>
    <small>ডেলিভারি: ${SET.deliveryNote || ''}</small></div>
    <p class="note">* সব তথ্য প্রচলিত ধর্মীয় বিশ্বাস অনুযায়ী। প্রতিটি পণ্যের আসল ছবি ও ভিডিও দেখে অর্ডার করতে পারবেন।</p>
  </div>
  <div class="buybar"><a class="inb" onclick="openMessenger()">💬 ইনবক্স করুন</a><a class="ord" onclick="location.hash='#order/${p.id}'">অর্ডার করুন</a></div>`;
}
let QTY = 1;
function chgQty(d) { QTY = Math.max(1, QTY + d); document.getElementById('qtyN').textContent = BN(QTY); }
function swapImg(el, im) { document.getElementById('heroImg').src = 'images/' + im; document.querySelectorAll('.thumbs img').forEach(t => t.classList.remove('on')); el.classList.add('on'); }

let AREA = 'in';
function orderHTML(p) {
  const di = SET.deliveryInsideDhaka ?? 60, do_ = SET.deliveryOutsideDhaka ?? 120;
  const body = p.price == null
    ? `<div class="trow"><span>প্রোডাক্টের দাম</span><span>ইনবক্সে জানানো হবে</span></div>
       <div class="trow"><span>ডেলিভারি চার্জ</span><span id="dCharge">${taka(di)}</span></div>`
    : `<div class="trow"><span>দাম × ${BN(QTY)}</span><span>${taka(p.price * QTY)}</span></div>
       <div class="trow"><span>ডেলিভারি চার্জ</span><span id="dCharge">${taka(di)}</span></div>
       <div class="trow total"><span>সর্বমোট</span><span id="gTotal">${taka(p.price * QTY + di)}</span></div>`;
  return `<div class="backbar"><span onclick="history.back()">‹</span> অর্ডার করুন</div>
  <div class="fcard"><h3>আপনার অর্ডার</h3><div class="frow"><img src="images/${p.image}"><div><b>${p.name}</b>${priceHTML(p)}<div style="font-size:13px;color:#8a7a63">পরিমাণ: ${BN(QTY)}টি</div></div></div></div>
  <div class="fcard"><h3>ডেলিভারির তথ্য</h3>
    <label class="fl">আপনার নাম *</label><input class="fi" id="fName" placeholder="নাম লিখুন">
    <label class="fl">মোবাইল নম্বর *</label><input class="fi" id="fPhone" placeholder="01XXXXXXXXX" inputmode="tel">
    <label class="fl">সম্পূর্ণ ঠিকানা *</label><textarea class="fi" id="fAddr" rows="2" placeholder="বাসা/হোল্ডিং, রোড, এলাকা, থানা, জেলা"></textarea>
    <label class="fl">ডেলিভারি এলাকা</label>
    <div class="radio"><label id="rIn" class="sel"><input type="radio" name="area" checked>ঢাকার ভিতরে (${taka(di)})</label>
    <label id="rOut"><input type="radio" name="area">ঢাকার বাইরে (${taka(do_)})</label></div>
    <div style="margin-top:14px">${body}</div>
    <button class="bigbtn" onclick="submitOrder('${p.id}')">অর্ডার কনফার্ম করুন</button>
    <p class="note">অর্ডার কনফার্ম করলে অর্ডারের বিবরণ তৈরি হয়ে যাবে — সেটি আমাদের Messenger-এ পাঠিয়ে দিলেই অর্ডার সম্পন্ন হবে। পণ্য হাতে পেয়ে মূল্য পরিশোধ (ক্যাশ অন ডেলিভারি) সুবিধা রয়েছে।</p>
  </div>
  <script>
    document.getElementById('rIn').onclick = () => setArea('in');
    document.getElementById('rOut').onclick = () => setArea('out');
  <\/script>`;
}
function setArea(a) {
  AREA = a;
  document.getElementById('rIn').classList.toggle('sel', a === 'in');
  document.getElementById('rOut').classList.toggle('sel', a === 'out');
  const p = DB.products.find(x => x.id === CUR_ORDER); if (!p) return;
  const ch = a === 'in' ? (SET.deliveryInsideDhaka ?? 60) : (SET.deliveryOutsideDhaka ?? 120);
  const dc = document.getElementById('dCharge'); if (dc) dc.textContent = taka(ch);
  const gt = document.getElementById('gTotal'); if (gt && p.price != null) gt.textContent = taka(p.price * QTY + ch);
}
let CUR_ORDER = null;
function submitOrder(id) {
  const p = DB.products.find(x => x.id === id);
  const name = document.getElementById('fName').value.trim();
  const phone = document.getElementById('fPhone').value.trim();
  const addr = document.getElementById('fAddr').value.trim();
  if (!name || !phone || !addr) { alert('নাম, মোবাইল নম্বর ও ঠিকানা — তিনটিই দিন।'); return; }
  const no = 'ORD-' + Date.now().toString().slice(-6);
  const ch = AREA === 'in' ? (SET.deliveryInsideDhaka ?? 60) : (SET.deliveryOutsideDhaka ?? 120);
  const lines = ['🛍️ নতুন অর্ডার — ' + (SET.shopName || 'অর্ধনারীশ্বর'),
    'অর্ডার নং: ' + no, 'প্রোডাক্ট: ' + p.name, 'পরিমাণ: ' + QTY + 'টি',
    p.price == null ? 'দাম: ইনবক্সে নিশ্চিত হবে' : 'মোট: ' + (p.price * QTY + ch) + ' টাকা (ডেলিভারি ' + ch + ' টাকাসহ)',
    'নাম: ' + name, 'মোবাইল: ' + phone, 'ঠিকানা: ' + addr,
    'এলাকা: ' + (AREA === 'in' ? 'ঢাকার ভিতরে' : 'ঢাকার বাইরে')];
  const text = lines.join('\n');
  $app.innerHTML = `<div class="backbar"><span onclick="location.hash=''">‹</span> অর্ডার সফল</div>
  <div class="ok"><div class="tick">✓</div><h2>অর্ডার তৈরি হয়েছে!</h2>
  <p>অর্ডার নম্বর: <b>${no}</b><br>শেষ ধাপ: নিচের বিবরণটি আমাদের Messenger-এ পাঠিয়ে দিন — তাহলেই অর্ডার কনফার্ম হবে। আমরা কল করে নিশ্চিত করব ইনশাআল্লাহ।</p>
  <div class="okbox" id="okText">${text}</div>
  <button class="copybtn" onclick="navigator.clipboard.writeText(document.getElementById('okText').innerText).then(()=>alert('কপি হয়েছে!'))">📋 বিবরণ কপি করুন</button>
  ${SET.messenger ? `<a class="msbtn" href="${SET.messenger}" target="_blank">💬 Messenger-এ পাঠান</a>` : ''}
  <p class="note" style="margin-top:14px">Messenger বাটনে গিয়ে কপি করা লেখাটি পেস্ট করে পাঠিয়ে দিন।</p></div>${bottomNav('home')}`;
  window.scrollTo(0, 0);
}
function route() {
  if (!DB) return;
  const h = location.hash || '';
  window.scrollTo(0, 0);
  if (h.startsWith('#p/')) {
    const p = DB.products.find(x => x.id === h.slice(3)); QTY = 1;
    $app.innerHTML = p ? detailHTML(p) : homeHTML(DB.products);
  } else if (h.startsWith('#order/')) {
    const p = DB.products.find(x => x.id === h.slice(7)); CUR_ORDER = p ? p.id : null; AREA = 'in';
    $app.innerHTML = p ? orderHTML(p) : homeHTML(DB.products);
  } else if (h.startsWith('#cat/')) {
    const c = decodeURIComponent(h.slice(5));
    const list = DB.products.filter(p => p.category === c);
    $app.innerHTML = `<div class="backbar"><span onclick="location.hash=''">‹</span> ${c}</div>
      <div style="height:14px"></div><div class="grid">${list.map(card).join('') || '<div class="empty">এই ক্যাটাগরিতে এখনো প্রোডাক্ট নেই।</div>'}</div>${bottomNav('cat')}`;
  } else if (h === '#cats') {
    const tiles = (DB.categories || []).map(c => `<div class="sec"><h3>${c}</h3><span onclick="location.hash='#cat/${encodeURIComponent(c)}'">সব দেখুন ›</span></div>
      <div class="grid">${DB.products.filter(p => p.category === c).slice(0, 4).map(card).join('')}</div>`).join('');
    $app.innerHTML = `<div class="backbar"><span onclick="location.hash=''">‹</span> ক্যাটাগরি</div>${tiles}${bottomNav('cat')}`;
  } else {
    $app.innerHTML = homeHTML(DB.products);
  }
}
</script>
</body>
</html>
